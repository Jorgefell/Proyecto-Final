<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal - Planillas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Sistema Integral de Planillas</span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Cerrar Sesión</button>
</nav>

<div class="container my-4">
    <ul class="nav nav-tabs mb-3" id="mainTabs">
        <li class="nav-item"><button class="nav-link active" onclick="cargarTrabajadores()">Trabajadores</button></li>
        <li class="nav-item"><button class="nav-link" onclick="cargarPlanillas()">Planillas</button></li>
        <li class="nav-item"><button class="nav-link" onclick="cargarCostosObra()">Reporte Costos por Obra</button></li>
    </ul>
    <div id="contenido" class="table-responsive"></div>
</div>

<script src="js/api.js"></script>
<script>
    if (!localStorage.getItem("jwt_token")) window.location.href = "index.html";

    function logout() {
        localStorage.clear();
        window.location.href = "index.html";
    }

    async function cargarTrabajadores() {
        const lista = await apiFetch("/Trabajadores");
        document.getElementById("contenido").innerHTML = `
            <table class="table table-striped">
                <thead><tr><th>Documento</th><th>Nombres</th><th>Apellidos</th><th>Modalidad</th><th>Base</th></tr></thead>
                <tbody>${lista.map(t => `<tr><td>${t.numeroDocumento}</td><td>${t.nombres}</td><td>${t.apellidos}</td><td>${t.modalidadPago}</td><td>S/ ${t.remuneracionBase}</td></tr>`).join("")}</tbody>
            </table>`;
    }

    async function cargarPlanillas() {
        const lista = await apiFetch("/Planillas");
        document.getElementById("contenido").innerHTML = `
            <table class="table table-striped">
                <thead><tr><th>Código</th><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Estado</th></tr></thead>
                <tbody>${lista.map(p => `<tr><td>${p.codigo}</td><td>${p.tipo}</td><td>${p.fechaInicio.slice(0,10)}</td><td>${p.fechaFin.slice(0,10)}</td><td>${p.estado}</td></tr>`).join("")}</tbody>
            </table>`;
    }

    async function cargarCostosObra() {
        const lista = await apiFetch("/Reportes/costos-por-obra");
        document.getElementById("contenido").innerHTML = `
            <table class="table table-bordered">
                <thead><tr><th>Obra</th><th>Planillas</th><th>Trabajadores</th><th>Costo Total Mano de Obra</th></tr></thead>
                <tbody>${lista.map(c => `<tr><td>${c.nombreObra}</td><td>${c.cantidadPlanillas}</td><td>${c.totalTrabajadores}</td><td>S/ ${c.costoTotalManoObra.toFixed(2)}</td></tr>`).join("")}</tbody>
            </table>`;
    }

    cargarTrabajadores();
</script>
</body>
</html>
